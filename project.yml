name: MyNotch
options:
  bundleIdPrefix: io.lucasvu
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  MyNotchCore:
    path: Packages/MyNotchCore
  NotchUI:
    path: Packages/NotchUI
  BatteryModule:
    path: Packages/Modules/Battery
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 3.1.0
targets:
  MyNotch:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: MyNotchCore
      - package: NotchUI
      - package: BatteryModule
      - package: KeyboardShortcuts
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: MyNotch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "MyNotch — personal build"
    entitlements:
      path: App/MyNotch.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.lucasvu.mynotch
        PRODUCT_NAME: MyNotch
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        # Ad-hoc ("Sign to Run Locally"). For stable TCC permissions set DEVELOPMENT_TEAM and change CODE_SIGN_IDENTITY to "Apple Development".
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES
